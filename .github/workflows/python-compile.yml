name: Python Compile Check

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile backend Python files
        working-directory: .
        run: python -m compileall -q app scripts test_routes.py
