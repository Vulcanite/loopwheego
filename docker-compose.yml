services:
  osrm-download:
    image: curlimages/curl:8.12.1
    container_name: osrm-download
    user: "0:0"
    volumes:
      - ${CONTAINER_DATA_DIR:-/home/ubuntu/container-data}/osrm-data:/data
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f /data/malaysia-singapore-brunei-latest.osm.pbf ]; then
          curl -fL https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf -o /data/malaysia-singapore-brunei-latest.osm.pbf
        fi
        cp /data/malaysia-singapore-brunei-latest.osm.pbf /data/bike-singapore.osm.pbf
    restart: "no"

  osrm-foot-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    container_name: osrm-foot-prepare
    user: "0:0"
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    volumes:
      - ${CONTAINER_DATA_DIR:-/home/ubuntu/container-data}/osrm-data:/data
    command:
      - sh
      - -c
      - |
        set -e
        osrm-extract -p /opt/foot.lua /data/malaysia-singapore-brunei-latest.osm.pbf
        osrm-partition /data/malaysia-singapore-brunei-latest.osrm
        osrm-customize /data/malaysia-singapore-brunei-latest.osrm
    restart: "no"

  osrm-bike-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    container_name: osrm-bike-prepare
    user: "0:0"
    depends_on:
      osrm-foot-prepare:
        condition: service_completed_successfully
    volumes:
      - ${CONTAINER_DATA_DIR:-/home/ubuntu/container-data}/osrm-data:/data
    command:
      - sh
      - -c
      - |
        set -e
        osrm-extract -p /opt/bicycle.lua /data/bike-singapore.osm.pbf
        osrm-partition /data/bike-singapore.osrm
        osrm-customize /data/bike-singapore.osrm
    restart: "no"

  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    container_name: osrm-foot
    user: "0:0"
    depends_on:
      osrm-bike-prepare:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ${CONTAINER_DATA_DIR:-/home/ubuntu/container-data}/osrm-data:/data
    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/malaysia-singapore-brunei-latest.osrm
    healthcheck:
      test: ["NONE"]
    restart: unless-stopped

  osrm-bike:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    container_name: osrm-bike
    user: "0:0"
    depends_on:
      osrm-foot:
        condition: service_started
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - ${CONTAINER_DATA_DIR:-/home/ubuntu/container-data}/osrm-data:/data
    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/bike-singapore.osrm
    healthcheck:
      test: ["NONE"]
    restart: unless-stopped

  nominatim:
    image: mediagis/nominatim:5.3
    container_name: nominatim-sg
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
    shm_size: "1gb"
    environment:
      PBF_URL: https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/asia/malaysia-singapore-brunei-updates/
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 10m

  overpass:
    image: wiktorn/overpass-api:v0.7.62.9
    container_name: overpass
    profiles:
      - overpass
    restart: unless-stopped
    ports:
      - "127.0.0.1:12345:80"
    volumes:
      - overpass-db:/db
    environment:
      OVERPASS_META: "no"
      OVERPASS_MODE: "init"
      OVERPASS_PLANET_URL: "http://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf"
      OVERPASS_DIFF_URL: "http://download.geofabrik.de/asia/malaysia-singapore-brunei-updates/"
      OVERPASS_UPDATE_SLEEP: "3600"
      OVERPASS_USE_AREAS: "false"
      OVERPASS_PLANET_PREPROCESS: "chmod 755 /db && mv /db/planet.osm.bz2 /db/planet.osm.pbf && osmium cat -o /db/planet.osm.bz2 /db/planet.osm.pbf && rm /db/planet.osm.pbf"
    healthcheck:
      test: ["CMD-SHELL", "curl --noproxy '*' -qfg 'http://localhost/api/status' | grep -q 'Connected as' || exit 1"]
      interval: 1m
      timeout: 30s
      retries: 20
      start_period: 48h

  opentopodata-prepare:
    image: alpine:3.20
    container_name: opentopodata-prepare
    profiles:
      - elevation
    user: "0:0"
    volumes:
      - ${CONTAINER_DATA_DIR:-/home/ubuntu/container-data}/opentopodata:/data
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache ca-certificates wget gzip
        mkdir -p /data/data/srtm30m
        cat > /data/config.yaml <<'EOF'
        datasets:
        - name: srtm30m
          path: data/srtm30m/
          filename_epsg: 4326
          filename_tile_size: 1
        EOF
        if [ ! -f /data/data/srtm30m/N01E103.hgt ]; then
          wget -q -O /tmp/N01E103.hgt.gz https://s3.amazonaws.com/elevation-tiles-prod/skadi/N01/N01E103.hgt.gz
          gunzip -c /tmp/N01E103.hgt.gz > /data/data/srtm30m/N01E103.hgt
          rm -f /tmp/N01E103.hgt.gz
        fi
        if [ ! -f /data/data/srtm30m/N01E104.hgt ]; then
          wget -q -O /tmp/N01E104.hgt.gz https://s3.amazonaws.com/elevation-tiles-prod/skadi/N01/N01E104.hgt.gz
          gunzip -c /tmp/N01E104.hgt.gz > /data/data/srtm30m/N01E104.hgt
          rm -f /tmp/N01E104.hgt.gz
        fi
    restart: "no"

  opentopodata:
    image: opentopodata
    profiles:
      - elevation
    build:
      context: https://github.com/ajnisbet/opentopodata.git
      dockerfile: docker/apple-silicon.Dockerfile
    container_name: opentopodata
    depends_on:
      opentopodata-prepare:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "127.0.0.1:2999:5000"
    volumes:
      - ${CONTAINER_DATA_DIR:-/home/ubuntu/container-data}/opentopodata/config.yaml:/app/config.yaml:ro
      - ${CONTAINER_DATA_DIR:-/home/ubuntu/container-data}/opentopodata/data:/app/data:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5).read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  nominatim-data:
  overpass-db:
